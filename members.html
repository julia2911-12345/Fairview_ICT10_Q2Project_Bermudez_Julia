
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Sets the character encoding and page dimensions -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Sets the browser tab title -->
    <title>Dance Club | Members</title>

    <!-- Connects the external CSS design -->
    <link rel="stylesheet" href="style.css">

    <!-- Loads the PyScript styling and JavaScript files -->
    <link rel="stylesheet"
    href="https://pyscript.net/releases/2026.7.3/core.css">

    <script type="module"
    src="https://pyscript.net/releases/2026.7.3/core.js"></script>

</head>

<body>

    <!-- NAVIGATION BAR: Contains the website logo and page links -->

    <nav>
        <div class="logo">DANCE CLUB.</div>

        <div class="nav-links">
            <!-- Links to the different website pages -->
            <a href="index.html">HOME</a>
            <a href="elements.html">ELEMENT CHECKER</a>
            <a href="members.html">MEMBERS</a>
            <a href="creators.html">CREATOR</a>
        </div>
    </nav>


    <!-- PAGE INTRODUCTION: Displays the page title and description -->

    <header>
        <h1>OUR DANCE CLUB</h1>

        <p>
            Meet the people who make up our community.
        </p>
    </header>


    <!-- ADD NEW MEMBER: Contains the input fields and button -->

    <div class="container">

        <h2>Add New Member</h2>

        <!-- Input field for the member's first name -->
        <input
            type="text"
            id="first_name"
            placeholder="First Name">

        <!-- Input field for the member's last name -->
        <input
            type="text"
            id="last_name"
            placeholder="Last Name">

        <!-- Calls the Python function when the button is clicked -->
        <button py-click="add_candidate">
            ADD MEMBER
        </button>

    </div>


    <!-- MEMBER LIST: Displays all registered members -->

    <div class="container result">

        <h2>Dance Club Members</h2>

        <!-- Displays the names generated by the Python code -->
        <div id="result">
            Loading member list...
        </div>

        <!-- Displays the total number of members -->
        <h3 id="total"></h3>

    </div>


    <!-- FOOTER: Displays the website copyright -->

    <footer>
        <p>© 2026 DANCE CLUB. ALL RIGHTS RESERVED.</p>
    </footer>


    <!-- PYTHON CONNECTION: Connects the HTML page to members.py -->

    <script type="py" src="members.py"></script>

</body>
</html>
